services:
  containerflow:
    build: .
    ports:
      - "${EXTERNAL_PORT:-9470}:9470"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - containerflow-data:/app/data
    environment:
      - DATA_DIR=/app/data
    env_file: .env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.15"
          memory: 256M

volumes:
  containerflow-data:
